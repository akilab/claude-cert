<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t-sse">
  <title id="t-sse">ストリーミング（SSE）のイベントの順番</title>
  <defs><marker id="ar-sse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="d-arrow"/></marker></defs>
  <rect x="20" y="20" width="190" height="40" rx="8" class="d-box-accent"/><text x="115" y="45" text-anchor="middle" class="d-mono">message_start</text>
  <rect x="60" y="80" width="560" height="140" rx="10" class="d-box"/>
  <text x="76" y="102" class="d-sub">content ブロックごとに繰り返す（index 0, 1, 2 …）</text>
  <rect x="76" y="114" width="170" height="40" rx="8" class="d-box-blue"/><text x="161" y="139" text-anchor="middle" class="d-mono">content_block_start</text>
  <rect x="266" y="114" width="170" height="40" rx="8" class="d-box-blue"/><text x="351" y="139" text-anchor="middle" class="d-mono">content_block_delta ×n</text>
  <rect x="456" y="114" width="150" height="40" rx="8" class="d-box-blue"/><text x="531" y="139" text-anchor="middle" class="d-mono">content_block_stop</text>
  <path d="M246 134 H262" class="d-line" marker-end="url(#ar-sse)"/><path d="M436 134 H452" class="d-line" marker-end="url(#ar-sse)"/>
  <text x="76" y="178" class="d-sub">delta の種類：text_delta（文章）／input_json_delta（ツール入力の JSON 断片）</text>
  <text x="76" y="198" class="d-sub">／thinking_delta・signature_delta（思考）</text>
  <path d="M115 60 V 76" class="d-line" marker-end="url(#ar-sse)"/>
  <rect x="20" y="240" width="190" height="40" rx="8" class="d-box-accent"/><text x="115" y="265" text-anchor="middle" class="d-mono">message_delta</text>
  <rect x="250" y="240" width="160" height="40" rx="8" class="d-box-accent"/><text x="330" y="265" text-anchor="middle" class="d-mono">message_stop</text>
  <path d="M115 220 V 236" class="d-line" marker-end="url(#ar-sse)"/><path d="M210 260 H246" class="d-line" marker-end="url(#ar-sse)"/>
  <text x="430" y="256" class="d-sub">stop_reason と出力トークン数は</text>
  <text x="430" y="274" class="d-sub">message_delta で届く</text>
</svg>
