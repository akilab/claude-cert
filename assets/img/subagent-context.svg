<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-labelledby="t-sub">
  <title id="t-sub">サブエージェントでコンテキストを分ける</title>
  <defs><marker id="ar-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="d-arrow"/></marker></defs>
  <rect x="220" y="20" width="200" height="70" rx="10" class="d-box-accent"/>
  <text x="320" y="48" text-anchor="middle" class="d-text" font-weight="700">オーケストレーター</text>
  <text x="320" y="70" text-anchor="middle" class="d-sub">計画と統合だけを持つ</text>
  <rect x="20" y="160" width="180" height="80" rx="10" class="d-box-blue"/><text x="110" y="190" text-anchor="middle" class="d-text">サブエージェント A</text><text x="110" y="212" text-anchor="middle" class="d-sub">ログ 20万トークンを調査</text>
  <rect x="230" y="160" width="180" height="80" rx="10" class="d-box-blue"/><text x="320" y="190" text-anchor="middle" class="d-text">サブエージェント B</text><text x="320" y="212" text-anchor="middle" class="d-sub">コードを調査</text>
  <rect x="440" y="160" width="180" height="80" rx="10" class="d-box-blue"/><text x="530" y="190" text-anchor="middle" class="d-text">サブエージェント C</text><text x="530" y="212" text-anchor="middle" class="d-sub">ドキュメントを調査</text>
  <path d="M260 90 L130 156" class="d-line" marker-end="url(#ar-sub)"/>
  <path d="M320 90 V156" class="d-line" marker-end="url(#ar-sub)"/>
  <path d="M380 90 L510 156" class="d-line" marker-end="url(#ar-sub)"/>
  <text x="150" y="120" class="d-sub">指示</text>
  <text x="470" y="120" class="d-sub">要約だけ返す</text>
  <text x="20" y="272" class="d-sub">大量の途中経過は各サブエージェントの中にとどまり、親のコンテキストは小さく保たれる（並列化もできる）。</text>
</svg>
