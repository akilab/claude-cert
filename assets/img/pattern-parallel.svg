<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t-par">
  <title id="t-par">並列化：分割（別々の仕事を同時に）と投票（同じ仕事を複数回）</title>
  <defs><marker id="ar-par" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="d-arrow"/></marker></defs>
  <rect x="16" y="6" width="14" height="14" rx="3" class="d-box-blue"/><text x="36" y="18" class="d-sub">LLM の呼び出し</text><rect x="140" y="6" width="14" height="14" rx="3" class="d-box-accent"/><text x="160" y="18" class="d-sub">コード（プログラム）</text><rect x="300" y="6" width="14" height="14" rx="3" class="d-box"/><text x="320" y="18" class="d-sub">入力・出力など</text>
  <text x="16" y="50" class="d-text" font-weight="700">A. 分割（セクショニング）</text>
  <rect x="105" y="62" width="140" height="40" rx="8" class="d-box"/><text x="175" y="87" text-anchor="middle" class="d-text">契約書</text>
  <path d="M175 102 L68 136" class="d-line" marker-end="url(#ar-par)"/><path d="M175 102 V136" class="d-line" marker-end="url(#ar-par)"/><path d="M175 102 L282 136" class="d-line" marker-end="url(#ar-par)"/>
  <rect x="16" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="66" y="164" text-anchor="middle" class="d-text">支払条件</text><text x="66" y="183" text-anchor="middle" class="d-sub">だけ確認</text>
  <rect x="125" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="175" y="164" text-anchor="middle" class="d-text">解約条項</text><text x="175" y="183" text-anchor="middle" class="d-sub">だけ確認</text>
  <rect x="234" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="284" y="164" text-anchor="middle" class="d-text">責任の範囲</text><text x="284" y="183" text-anchor="middle" class="d-sub">だけ確認</text>
  <path d="M66 196 L160 232" class="d-line" marker-end="url(#ar-par)"/><path d="M175 196 V232" class="d-line" marker-end="url(#ar-par)"/><path d="M284 196 L190 232" class="d-line" marker-end="url(#ar-par)"/>
  <rect x="95" y="236" width="160" height="44" rx="8" class="d-box-accent"/><text x="175" y="263" text-anchor="middle" class="d-text">1つにまとめる</text>
  <text x="16" y="308" class="d-sub">中身の違う仕事を同時に → 速くなる</text>
  <path d="M360 34 V316" class="d-line d-dash"/>
  <text x="380" y="50" class="d-text" font-weight="700">B. 投票（ボーティング）</text>
  <rect x="469" y="62" width="140" height="40" rx="8" class="d-box"/><text x="539" y="87" text-anchor="middle" class="d-text">プログラム</text>
  <path d="M539 102 L432 136" class="d-line" marker-end="url(#ar-par)"/><path d="M539 102 V136" class="d-line" marker-end="url(#ar-par)"/><path d="M539 102 L646 136" class="d-line" marker-end="url(#ar-par)"/>
  <rect x="380" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="430" y="164" text-anchor="middle" class="d-text">検査 1回目</text><text x="430" y="183" text-anchor="middle" class="d-sub">→ 問題あり</text>
  <rect x="489" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="539" y="164" text-anchor="middle" class="d-text">検査 2回目</text><text x="539" y="183" text-anchor="middle" class="d-sub">→ 問題あり</text>
  <rect x="598" y="140" width="100" height="56" rx="8" class="d-box-blue"/><text x="648" y="164" text-anchor="middle" class="d-text">検査 3回目</text><text x="648" y="183" text-anchor="middle" class="d-sub">→ 問題なし</text>
  <path d="M430 196 L524 232" class="d-line" marker-end="url(#ar-par)"/><path d="M539 196 V232" class="d-line" marker-end="url(#ar-par)"/><path d="M648 196 L554 232" class="d-line" marker-end="url(#ar-par)"/>
  <rect x="459" y="236" width="160" height="44" rx="8" class="d-box-accent"/><text x="539" y="257" text-anchor="middle" class="d-text">多数決</text><text x="539" y="273" text-anchor="middle" class="d-sub">2対1 → 問題あり</text>
  <text x="380" y="308" class="d-sub">同じ仕事を複数回 → 判断が安定する</text>
</svg>
