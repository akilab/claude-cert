<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t-cache">
  <title id="t-cache">プロンプトキャッシュは先頭から一致する部分（プレフィックス）を再利用する</title>
  <text x="20" y="26" class="d-text" font-weight="700">◯ 変わらない部分を先頭に置く</text>
  <rect x="20" y="38" width="120" height="40" rx="6" class="d-box-ok"/><text x="80" y="63" text-anchor="middle" class="d-mono">tools</text>
  <rect x="144" y="38" width="200" height="40" rx="6" class="d-box-ok"/><text x="244" y="63" text-anchor="middle" class="d-mono">system（規程 8,000 tok）</text>
  <rect x="348" y="38" width="130" height="40" rx="6" class="d-box-ok"/><text x="413" y="63" text-anchor="middle" class="d-mono">過去の会話</text>
  <rect x="482" y="38" width="138" height="40" rx="6" class="d-box"/><text x="551" y="63" text-anchor="middle" class="d-mono">新しい質問</text>
  <path d="M478 30 V 88" class="d-line-accent"/>
  <text x="478" y="102" text-anchor="middle" class="d-sub">cache_control（区切り）</text>
  <text x="20" y="124" class="d-sub">緑の部分は2回目から cache_read（入力単価の 0.1倍程度）。最初のトークンが出るまでの時間も短くなる。</text>

  <text x="20" y="170" class="d-text" font-weight="700">✕ 変わる部分が先頭にある</text>
  <rect x="20" y="182" width="170" height="40" rx="6" class="d-box-ng"/><text x="105" y="207" text-anchor="middle" class="d-mono">現在時刻・利用者名</text>
  <rect x="194" y="182" width="200" height="40" rx="6" class="d-box"/><text x="294" y="207" text-anchor="middle" class="d-mono">system（規程）</text>
  <rect x="398" y="182" width="222" height="40" rx="6" class="d-box"/><text x="509" y="207" text-anchor="middle" class="d-mono">新しい質問</text>
  <text x="20" y="250" class="d-sub">先頭が毎回変わるので、後ろの規程が同じでも一致しない → 毎回キャッシュの書き込みになり、むしろ高くつく。</text>
  <text x="20" y="276" class="d-sub">キャッシュされる順番：tools → system → messages。最小の長さ（例：512 トークン）に満たないとキャッシュされない。</text>
</svg>
