<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F 基礎固めドリル</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1f2328; --sub:#5b6370; --line:#d9d6cc;
  --accent:#c2562b; --accent-ink:#ffffff; --ok:#1c7c4a; --ok-bg:#e3f4ea; --ng:#b3261e; --ng-bg:#fbe7e5;
  --warn-bg:#fff4d6; --code-bg:#f0eee7; --sel:#e8eefc; --sel-line:#3b63c9;
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1e2125; --ink:#e8e6e1; --sub:#a0a6b0; --line:#343a42;
  --accent:#e0794d; --accent-ink:#1a1a1a; --ok:#58c58a; --ok-bg:#16322398; --ng:#ff8f86; --ng-bg:#3a1c1a98;
  --warn-bg:#3b3318; --code-bg:#14161a; --sel:#1f2c4d; --sel-line:#7fa0ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#15171a; --card:#1e2125; --ink:#e8e6e1; --sub:#a0a6b0; --line:#343a42;
    --accent:#e0794d; --accent-ink:#1a1a1a; --ok:#58c58a; --ok-bg:#16322398; --ng:#ff8f86; --ng-bg:#3a1c1a98;
    --warn-bg:#3b3318; --code-bg:#14161a; --sel:#1f2c4d; --sel-line:#7fa0ff;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.75;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hbar{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hbar h1{font-size:18px;margin:0;flex:1;min-width:180px}
.tabs{display:flex;gap:4px;max-width:860px;margin:0 auto;padding:0 16px 8px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
h2{font-size:20px;margin:24px 0 8px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.round{display:block;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.round:hover{border-color:var(--accent)}
.round b{font-size:16px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin-left:6px}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress>i{display:block;height:100%;background:var(--accent);width:0}
.tag{display:inline-block;font-size:12px;background:var(--code-bg);padding:2px 10px;border-radius:999px;color:var(--sub)}
.stem{font-size:18px;font-weight:600;margin:10px 0 14px}
.opt{display:flex;gap:8px;align-items:stretch;margin:10px 0}
.opt .main{flex:1;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;display:flex;gap:10px}
.opt .main:hover:not(:disabled){border-color:var(--sel-line)}
.opt .no{font-weight:700;color:var(--sub);min-width:1.4em}
.opt.sel .main{background:var(--sel);border-color:var(--sel-line)}
.opt .x{width:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:18px;color:var(--sub)}
.opt .x:hover{border-color:var(--ng);color:var(--ng)}
.opt.gone .main{opacity:.4;text-decoration:line-through;background:var(--code-bg)}
.opt.gone .x{color:var(--accent)}
.opt.right .main{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong .main{background:var(--ng-bg);border-color:var(--ng)}
.exp{margin:-4px 0 6px 0;padding:8px 14px;font-size:14.5px;color:var(--sub);border-left:3px solid var(--line)}
.exp.c{border-left-color:var(--ok);color:var(--ink)}
.verdict{font-size:20px;font-weight:700;margin:14px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.point{background:var(--warn-bg);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.bar .lab{width:230px;flex-shrink:0}
.bar .track{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent)}
.bar .num{width:92px;text-align:right;color:var(--sub);flex-shrink:0}
@media(max-width:560px){.bar{flex-wrap:wrap}.bar .lab{width:100%}}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.6;margin:8px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.flow{display:grid;grid-template-columns:1fr 60px 1fr;gap:6px;align-items:center;text-align:center;margin:10px 0}
.flow .node{border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-weight:600}
.flow .arr{color:var(--accent);font-size:13px;line-height:1.3}
.dir{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-right:6px}
.dir.back{background:var(--sel-line);color:#fff}
.dir.self{background:var(--ok);color:#fff}
.hide{display:none}
details{margin:6px 0}
summary{cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1>CCDV-F 基礎固めドリル</h1>
    <button class="btn small" id="themeBtn" title="表示モードを切り替え">🌓 自動</button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="quiz" aria-selected="true">問題を解く</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">成績</button>
    <button class="tab" role="tab" data-tab="api" aria-selected="false">Messages API のやり取り</button>
    <button class="tab" role="tab" data-tab="info" aria-selected="false">試験情報</button>
  </div>
</header>
<main class="wrap">
  <section id="tab-quiz"></section>
  <section id="tab-stats" class="hide"></section>
  <section id="tab-api" class="hide"></section>
  <section id="tab-info" class="hide"></section>
</main>

<script>
/* ============ 分野 ============ */
var DOM = {
  app:  {name:"アプリケーションと統合", w:33.1},
  model:{name:"モデル選択と最適化", w:16.8},
  agent:{name:"エージェントとワークフロー", w:14.7},
  prompt:{name:"プロンプトとコンテキスト", w:11.0},
  tools:{name:"ツールと MCP", w:10.6},
  sec:  {name:"セキュリティと安全", w:8.1},
  code: {name:"Claude Code", w:3.1},
  eval: {name:"評価・テスト・デバッグ", w:2.6}
};

/* ============ 問題 ============
   o の先頭 n 個が正解（表示時にシャッフルされる）。ex は o と同じ順の選択肢ごとの解説。 */
var Q = [
/* ---- アプリケーションと統合 ---- */
{d:"app", q:"Claude の Messages API にリクエストを送るとき、最低限必要な項目の組み合わせはどれですか。",
 o:["model（モデル名）、max_tokens（出力の上限）、messages（会話の内容）","model、prompt、system","messages、system、tools","model、messages、stream"],
 ex:["正解。この3つが必須です。system・tools・stream などは任意です。",
     "prompt は古い形式のフィールドです。Messages API では会話を messages に入れます。また max_tokens が足りません。",
     "model と max_tokens がありません。system と tools は必要なときだけ付ける任意項目です。",
     "stream は任意（省略すると一括で返る）で、必須の max_tokens が抜けています。"],
 pt:"必須は model / max_tokens / messages の3つ。まずこれを覚える。"},
{d:"app", q:"Messages API は「ステートレス」です。会話を続けたいとき、アプリ側はどうしますか。",
 o:["毎回、これまでのやり取り（履歴）をすべて messages に入れて送る","最初に発行された会話IDだけを毎回送る","Claude が前回の内容を覚えているので、新しい発言だけを送る","履歴は送らず、system に「前の続きです」と書く"],
 ex:["正解。API はやり取りを覚えません。履歴の管理はアプリ側の仕事で、毎回全部送ります。",
     "Messages API に会話IDの仕組みはありません。履歴は自分で持ちます。",
     "覚えていません。新しい発言だけ送ると、Claude は文脈なしで答えることになります。",
     "「続きです」と書いても、中身を渡さなければ Claude は前の内容を知りません。"],
 pt:"ステートレス＝毎回、履歴ごと送る。履歴が増えるほど入力トークンも増える。"},
{d:"app", q:"messages 配列の各要素に指定する role として、正しいのはどれですか。",
 o:["user と assistant を交互に使う","system と user を使う","human と ai を使う","system・user・assistant を自由に混ぜて入れる"],
 ex:["正解。ユーザーの発言は user、Claude の発言は assistant です。",
     "system は messages の中ではなく、トップレベルの system パラメータで指定します。",
     "human / ai は他のライブラリで見かける呼び方です。Claude の API では使いません。",
     "system は messages の中に入れません。また user と assistant は基本的に交互に並べます。"],
 pt:"messages の role は user / assistant の2種類。役割指示は system パラメータ。"},
{d:"app", q:"「あなたは丁寧なサポート担当です」のような役割や方針を、会話全体に効かせたいとき、基本的にどこへ書きますか。",
 o:["リクエストのトップレベルにある system パラメータ","messages の先頭に role を system にして入れる","model 名の後ろに付け足す","毎回ユーザーの発言の末尾に手作業で足す"],
 ex:["正解。system パラメータが、会話全体に効く指示の置き場所です。",
     "messages の role に system はありません。",
     "model はモデルを指定する項目で、指示を書く場所ではありません。",
     "動くこともありますが、基本の置き場所ではありません。手間が増え、書き忘れも起きます。"],
 pt:"全体に効かせる指示 → system パラメータ。"},
{d:"app", q:"レスポンスの stop_reason が「max_tokens」だったとき、何が起きたと考えられますか。",
 o:["出力が max_tokens の上限に達して、文章が途中で切れた","Claude が答えを書き終えて、自然に終了した","Claude がツールの実行を求めている","入力が長すぎて、リクエストが拒否された"],
 ex:["正解。上限で打ち切られています。max_tokens を増やす、または出力を短くするよう指示します。",
     "それは end_turn の説明です。",
     "それは tool_use の説明です。",
     "入力が長すぎる場合はエラー（400 系）が返り、stop_reason は付きません。"],
 pt:"stop_reason：end_turn＝完了／max_tokens＝上限で切れた／tool_use＝ツール要求。"},
{d:"app", q:"レスポンスの stop_reason が「tool_use」だったとき、アプリがすべきことはどれですか。",
 o:["要求されたツールを自分のコードで実行し、結果を tool_result として返して続きを呼び出す","text の内容をそのまま画面に出して終わる","同じリクエストをそのまま送り直す","Claude が自動でツールを実行済みなので、結果を待つ"],
 ex:["正解。ツールの実行はアプリの仕事です。結果を返すと Claude が続きを作ります。",
     "このときの Claude は、まだ答えを出していません。ツールの結果を待っている状態です。",
     "同じ内容を送ると、同じ要求が返ってくるだけです。",
     "自分で定義したツールは Claude が実行しません。呼び出しを「要求」するだけです。"],
 pt:"tool_use が返ったら、実行 → tool_result を返す → 再び API を呼ぶ。"},
{d:"app", q:"API キーの扱いとして、適切なのはどれですか。",
 o:["サーバー側で環境変数やシークレット管理から読み込み、ブラウザには渡さない","ブラウザの JavaScript に書き込み、利用者の端末から直接 API を呼ぶ","ソースコードに直接書いて、Git で共有する","チームのチャットに貼って、全員で共有する"],
 ex:["正解。キーはサーバー側で守り、フロントエンドからはサーバーを経由して呼びます。",
     "ブラウザに入れると、開発者ツールで誰でも見られます。",
     "Git に入ると履歴に残り、漏えいの原因になります。",
     "チャットには履歴が残り、見られる人も増えます。共有ではなく適切な管理が必要です。"],
 pt:"API キー＝サーバー側の環境変数／シークレット管理。フロントや Git に置かない。"},
{d:"app", q:"API が 429（レート制限）を返したとき、対応として適切なのはどれですか。",
 o:["少し待ってから、間隔を延ばしながら（指数バックオフで）再試行する","すぐに何度も連続で再試行する","リクエストの内容を書き換えて送り直す","エラーを無視して、空の結果を返す"],
 ex:["正解。一時的な混雑なので、待って再試行します。間隔を延ばすのが定石です。",
     "連打すると制限をさらに悪化させます。",
     "429 は内容の誤りではなく、回数や量の制限です。内容を直しても解決しません（内容の誤りは 400 系）。",
     "失敗を隠すと、利用者もアプリも異常に気づけません。"],
 pt:"429・500・529 は待って再試行。400・401・403 は直さないと同じ失敗が続く。"},
{d:"app", q:"ストリーミング（stream を有効にする）を使う、主な利点はどれですか。",
 o:["生成中の文字から順に表示でき、利用者の体感の待ち時間が短くなる","料金が半額になる","回答の品質が上がる","トークン数を数えなくてよくなる"],
 ex:["正解。全部できあがるのを待たずに、先頭から見せられます。",
     "料金は変わりません（半額になるのはバッチ処理のほうです）。",
     "品質は変わりません。届け方が変わるだけです。",
     "トークンは通常どおり使われ、課金されます。"],
 pt:"ストリーミング＝体感速度の改善。品質や料金は変わらない。"},
{d:"app", q:"レスポンスの content は、どのような形ですか。",
 o:["ブロック（text など）のリストで、テキストは content[0].text のように取り出す","常に1つの文字列","必ず構造化された JSON オブジェクト","base64 でエンコードされたバイナリ"],
 ex:["正解。text ブロックのほか、ツール利用ブロックなども並びます。",
     "文字列ではなく、ブロックのリストです。",
     "JSON として返すかは、プロンプトで頼んだ内容次第です。content の形そのものは決まっています。",
     "バイナリではありません。"],
 pt:"content はブロックのリスト。text 以外のブロックも入り得る。"},
{d:"app", q:"1回のリクエストで使われたトークン数は、どこで確認できますか。",
 o:["レスポンスの usage（input_tokens と output_tokens）","リクエストに指定した model の名前","レスポンスの stop_reason","確認できず、請求書でしかわからない"],
 ex:["正解。入力と出力の使用量が毎回返ります。費用の見積もりやログに使います。",
     "model はモデルを指定する項目で、トークン数は示しません。",
     "stop_reason は終了の理由を示します。",
     "毎回のレスポンスにありますので、アプリ側で記録できます。"],
 pt:"usage を記録しておけば、コストの監視ができる。"},
{d:"app", q:"プロンプトやモデル名の扱いとして、保守しやすいのはどれですか。",
 o:["コードに直書きせず、設定ファイルや環境変数など、変更しやすい場所で管理する","同じ文言をコードの各所にコピーして書く","本番でも、個人のメモから毎回貼り付けて使う","変更のたびに、全員へ手作業で連絡する"],
 ex:["正解。1か所で管理すれば、モデルの切り替えや文言の修正が安全にできます。",
     "コピーが散らばると、修正漏れが出ます。",
     "ミスが起きやすく、再現もできません。",
     "手作業は漏れの元です。仕組みで管理します。"],
 pt:"モデル名・プロンプト・上限値は設定として切り出す（構成管理）。"},
{d:"app", q:"外部サービスの一時的な障害で、アプリ全体が落ちないようにしたい。基本の設計はどれですか。",
 o:["回数に上限をつけた再試行と、失敗時の代替表示（フォールバック）を用意する","成功するまで、無制限に再試行し続ける","例外を握りつぶして、何もなかったように進める","障害が起きないよう、利用者数を制限する"],
 ex:["正解。上限付きの再試行と代替手段で、機能を縮めながら動かし続けます（グレースフルな劣化）。",
     "無制限だと、処理が詰まり、相手にも負荷をかけ続けます。",
     "失敗を隠すと、誤った結果を出したまま進みます。",
     "障害は利用者数と無関係に起こります。"],
 pt:"再試行は上限つき＋フォールバック。失敗を隠さない。"},
{d:"app", q:"夜間に大量の文書を要約したい。結果はすぐ必要ではない。コストを抑える手段はどれですか。",
 o:["Message Batches API で非同期にまとめて処理する","1件ずつ同期で、最高性能のモデルに送る","ストリーミングで1件ずつ表示させる","すべての文書を1つの巨大なプロンプトにつなげて1回で送る"],
 ex:["正解。急がない大量処理向けの仕組みで、通常より割安です（結果は後で受け取ります）。",
     "即時性が不要なのに、最も高い方法を選んでいます。",
     "ストリーミングは待ち時間の見せ方の工夫で、コスト削減の手段ではありません。",
     "上限を超えやすく、精度も落ちます。1件ずつの独立した処理に分けるほうが扱いやすいです。"],
 pt:"急がない大量処理 → Batch API（非同期・割安）。"},
{d:"app", q:"SDK を使わず HTTP で Messages API を呼ぶとき、リクエストヘッダに必要なものはどれですか。",
 o:["x-api-key（認証）と anthropic-version（APIバージョン）","Cookie にセッションIDを入れる","URL のクエリ文字列に API キーを付ける","X-Model と X-Region"],
 ex:["正解。content-type: application/json と合わせて、この3つが基本です。",
     "Cookie による認証は使いません。",
     "URL にキーを付けると、ログや履歴に残ります。キーはヘッダで渡します。",
     "そのようなヘッダは必要ありません。モデルは本文の model で指定します。"],
 pt:"ヘッダ：x-api-key / anthropic-version / content-type。"},
{d:"app", q:"会話が長くなり、履歴がコンテキストウィンドウの上限に近づいてきました。適切な対応はどれですか。",
 o:["古いやり取りを要約して置き換えるなど、送る履歴を整理する","上限を超えても、そのまま送り続ける","max_tokens を大きくすれば、入力の上限も増える","履歴の途中のメッセージを、無作為に削除する"],
 ex:["正解。重要な情報を残しつつ、送る量を減らします。",

     "max_tokens は出力の上限です。入力の上限は増えません。",

var KEY = "ccdvf-ogura-v1";

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

/* ============ ユーティリティ ============ */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
var qbox=document.getElementById("tab-quiz");
var ROUND=10;

/* 回ごとの問題：分野が混ざるよう、番号を回数で割った余りで振り分ける */
function roundIds(r){ return Q.filter(function(x,i){ return i%5===r; }).map(function(x){return x.id;}); }
function byId(id){ return Q.filter(function(x){return x.id===id;})[0]; }
function nRounds(){ return 5; }

/* ============ スタート画面 ============ */
var cur=null;
function home(){
  cur=null;
  var wrong=Q.filter(function(x){ var r=S.rec[x.id]; return r && r.last===0; });
  var fresh=Q.filter(function(x){ return !S.rec[x.id]; });
  var h='<div class="card"><h2 style="margin-top:0">基礎固め 全'+Q.length+'問</h2>'+
    '<p class="muted">1回10問。基本的な内容を中心に、解説を厚くしてあります。試験の配点（8分野）に合わせて出題を配分しています。</p>'+
    '<label class="muted"><input type="checkbox" id="shufChk" '+(S.shuffle?"checked":"")+'> 選択肢の並びをシャッフルする</label></div>';
  h+='<h2>回を選ぶ</h2><div class="grid">';
  for(var r=0;r<nRounds();r++){
    var ids=roundIds(r), b=S.best[r];
    h+='<button class="round" data-r="'+r+'"><b>第'+(r+1)+'回</b><span class="badge'+(b!=null&&b>=ids.length*0.8?' ok':'')+'">'+(b==null?'未挑戦':'最高 '+b+'/'+ids.length)+'</span><div class="muted">'+ids.length+'問</div></button>';
  }
  h+='</div><h2>解き方を選ぶ</h2><div class="grid">'+
    '<button class="round" id="goWrong" '+(wrong.length?'':'disabled')+'><b>間違えた問題だけ</b><span class="badge">'+wrong.length+'問</span><div class="muted">直近で間違えたもの</div></button>'+
    '<button class="round" id="goFresh" '+(fresh.length?'':'disabled')+'><b>未回答の問題から10問</b><span class="badge">'+fresh.length+'問</span><div class="muted">まだ解いていないもの</div></button>'+
    '<button class="round" id="goRand"><b>ランダム10問</b><div class="muted">全問から無作為に</div></button>'+
    '<button class="round" id="goAll"><b>全問を通しで</b><span class="badge">'+Q.length+'問</span><div class="muted">本番形式の通し練習</div></button>'+
    '</div>';
  qbox.innerHTML=h;
  document.getElementById("shufChk").onchange=function(){ S.shuffle=this.checked; save(); };
  qbox.querySelectorAll("[data-r]").forEach(function(b){ b.onclick=function(){ var r=+b.dataset.r; start(roundIds(r),"第"+(r+1)+"回",r); }; });
  document.getElementById("goWrong").onclick=function(){ start(wrong.map(function(x){return x.id;}).slice(0,Math.max(wrong.length,1)),"間違えた問題"); };
  document.getElementById("goFresh").onclick=function(){ start(fresh.slice(0,ROUND).map(function(x){return x.id;}),"未回答から"); };
  document.getElementById("goRand").onclick=function(){ start(shuffle(Q.map(function(x){return x.id;})).slice(0,ROUND),"ランダム"); };
  document.getElementById("goAll").onclick=function(){ start(Q.map(function(x){return x.id;}),"通し"); };
}

/* 確認ダイアログの代わり：1回目で文言が変わり、4秒以内にもう1回押すと実行 */
function twoTap(btn,msg,fn){
  var orig=btn.textContent, armed=false, t;
  btn.onclick=function(){
    if(armed){ clearTimeout(t); fn(); return; }
    armed=true; btn.textContent=msg; btn.classList.add("primary");
    t=setTimeout(function(){ armed=false; btn.textContent=orig; btn.classList.remove("primary"); },4000);
  };
}
/* ============ 出題 ============ */
function start(ids,label,round){
  cur={ids:ids,label:label,round:round,i:0,results:[],view:null};
  question();
}
function question(){
  var q=byId(cur.ids[cur.i]);
  var order=[]; for(var k=0;k<q.o.length;k++) order.push(k);
  if(S.shuffle) order=shuffle(order);
  cur.view={q:q,order:order,sel:{},gone:{},done:false};
  drawQ();
}
function drawQ(){
  var v=cur.view,q=v.q,total=cur.ids.length;
  var h='<div class="row" style="justify-content:space-between;align-items:center;margin-top:16px"><span class="muted">'+esc(cur.label)+'　'+(cur.i+1)+' / '+total+'</span>'+
    '<button class="btn small" id="quit">やめる</button></div>'+
    '<div class="progress"><i style="width:'+((cur.i+(v.done?1:0))/total*100)+'%"></i></div>'+
    '<div class="card"><span class="tag">'+esc(DOM[q.d].name)+'</span>'+
    '<div class="stem">'+esc(q.q)+(q.n>1?'（'+q.n+'つ選ぶ）':'')+'</div>';
  v.order.forEach(function(oi,pos){
    var cls="opt", correct=oi<q.n;
    if(v.sel[oi]) cls+=" sel";
    if(v.gone[oi]) cls+=" gone";
    if(v.done){ if(correct) cls+=" right"; else if(v.sel[oi]) cls+=" wrong"; }
    h+='<div class="'+cls+'"><button class="main" data-o="'+oi+'" '+(v.done?'disabled':'')+'><span class="no">'+(pos+1)+'</span><span>'+esc(q.o[oi])+'</span></button>'+
       (v.done?'':'<button class="x" data-x="'+oi+'" title="'+(v.gone[oi]?'元に戻す':'この選択肢を消す')+'" aria-label="'+(v.gone[oi]?'元に戻す':'この選択肢を消す')+'">'+(v.gone[oi]?'↩':'✕')+'</button>')+'</div>';
    if(v.done) h+='<div class="exp'+(correct?' c':'')+'">'+(correct?'<b>○ 正解の選択肢。</b>':'<b>× 誤り。</b>')+esc(q.ex[oi])+'</div>';
  });
  if(!v.done){
    h+='<div class="row"><button class="btn primary" id="submit" disabled>回答する</button><span class="muted" style="align-self:center">✕ で消去／キー：1〜4で選択、Enterで回答</span></div>';
  } else {
    var ok=v.ok;
    h+='<div class="verdict '+(ok?'ok':'ng')+'">'+(ok?'⭕ 正解':'❌ 不正解')+'</div>'+
       '<div class="point"><b>ここがポイント：</b>'+esc(q.pt)+'</div>'+
       '<div class="row"><button class="btn primary" id="next">'+(cur.i+1<total?'次の問題へ':'結果を見る')+'</button></div>';
  }
  h+='</div>';
  qbox.innerHTML=h;
  qbox.querySelectorAll("[data-o]").forEach(function(b){ b.onclick=function(){ pick(+b.dataset.o); }; });
  qbox.querySelectorAll("[data-x]").forEach(function(b){ b.onclick=function(){ eliminate(+b.dataset.x); }; });
  var sb=document.getElementById("submit"); if(sb){ sb.onclick=submit; updSubmit(); }
  var nb=document.getElementById("next"); if(nb) nb.onclick=next;
  twoTap(document.getElementById("quit"),"本当にやめる（回答は残ります）",home);
}
function updSubmit(){
  var v=cur.view, n=Object.keys(v.sel).filter(function(k){return v.sel[k];}).length;
  var sb=document.getElementById("submit"); if(sb) sb.disabled = n!==v.q.n;
}
function pick(oi){
  var v=cur.view; if(v.done) return;
  if(v.gone[oi]) return;
  if(v.q.n===1){ v.sel={}; v.sel[oi]=true; }
  else { v.sel[oi]=!v.sel[oi]; }
  drawQ();
}
function eliminate(oi){
  var v=cur.view; if(v.done) return;
  v.gone[oi]=!v.gone[oi];
  if(v.gone[oi]) v.sel[oi]=false;
  drawQ();
}
function submit(){
  var v=cur.view,q=v.q; if(v.done) return;
  var picked=Object.keys(v.sel).filter(function(k){return v.sel[k];}).map(Number);
  if(picked.length!==q.n) return;
  v.ok = picked.every(function(oi){return oi<q.n;});
  v.done=true;
  var r=S.rec[q.id]||{r:0,w:0,last:null};
  if(v.ok) r.r++; else r.w++;
  r.last=v.ok?1:0; S.rec[q.id]=r;
  cur.results.push({id:q.id,ok:v.ok});
  save(); drawQ();
}
function next(){
  if(cur.i+1<cur.ids.length){ cur.i++; question(); } else finish();
}
document.addEventListener("keydown",function(e){
  if(!cur||!cur.view||document.getElementById("tab-quiz").classList.contains("hide")) return;
  var v=cur.view;
  if(e.key==="Enter"){ e.preventDefault(); if(v.done) next(); else { var sb=document.getElementById("submit"); if(sb&&!sb.disabled) submit(); } return; }
  if(/^[1-9]$/.test(e.key) && !v.done){ var oi=v.order[+e.key-1]; if(oi!==undefined) pick(oi); }
});

/* ============ 結果 ============ */
function finish(){
  var res=cur.results, ok=res.filter(function(x){return x.ok;}).length, total=res.length;
  if(cur.round!=null){ if(S.best[cur.round]==null||ok>S.best[cur.round]){ S.best[cur.round]=ok; save(); } }
  var wrong=res.filter(function(x){return !x.ok;}).map(function(x){return x.id;});
  var rate=total?Math.round(ok/total*100):0;
  var h='<div class="card"><h2 style="margin-top:0">結果：'+ok+' / '+total+'問（'+rate+'%）</h2>'+
    '<p>'+(rate>=80?'よくできています。この調子で他の回も進めましょう。':rate>=60?'あと一歩です。間違えた問題の解説を読み返しましょう。':'基礎の確認が必要です。解説を読んでから、もう一度挑戦しましょう。')+'</p>';
  if(wrong.length){
    h+='<h3>間違えた問題</h3>';
    wrong.forEach(function(id){
      var q=byId(id);
      h+='<details><summary>'+esc(q.q)+'</summary><div class="exp c" style="margin-top:6px"><b>正解：</b>'+q.o.slice(0,q.n).map(esc).join(' ／ ')+'<br><b>ポイント：</b>'+esc(q.pt)+'</div></details>';
    });
  } else h+='<p class="muted">全問正解です。</p>';
  h+='<div class="row">';
  if(wrong.length) h+='<button class="btn primary" id="retryWrong">間違えた'+wrong.length+'問を解き直す</button>';
  h+='<button class="btn" id="retryAll">同じ問題をもう一度</button><button class="btn" id="goHome">回の選択へ戻る</button></div></div>';
  qbox.innerHTML=h;
  var rw=document.getElementById("retryWrong"); if(rw) rw.onclick=function(){ start(wrong,"解き直し"); };
  document.getElementById("retryAll").onclick=function(){ start(cur.ids,cur.label,cur.round); };
  document.getElementById("goHome").onclick=home;
  window.scrollTo(0,0);
}

/* ============ 成績 ============ */
function renderStats(){
  var box=document.getElementById("tab-stats");
  var tr=0,tw=0; for(var k in S.rec){ tr+=S.rec[k].r; tw+=S.rec[k].w; }
  var h='<div class="card"><h2 style="margin-top:0">成績</h2><p>延べ回答 '+(tr+tw)+'回　正解率 '+((tr+tw)?Math.round(tr/(tr+tw)*100):0)+'%</p>'+
    '<p class="muted">分野ごとの正解率です。試験では、配点の大きい分野ほど合否に効きます。</p>';
  Object.keys(DOM).forEach(function(d){
    var r=0,w=0; Q.forEach(function(q){ if(q.d===d && S.rec[q.id]){ r+=S.rec[q.id].r; w+=S.rec[q.id].w; } });
    var p=(r+w)?Math.round(r/(r+w)*100):0;
    h+='<div class="bar"><span class="lab">'+DOM[d].name+'（配点 '+DOM[d].w+'%）</span><span class="track"><i style="width:'+p+'%"></i></span><span class="num">'+((r+w)?p+'%（'+r+'/'+(r+w)+'）':'未回答')+'</span></div>';
  });
  var wr=Q.filter(function(q){ return S.rec[q.id] && S.rec[q.id].last===0; });
  h+='<h3 style="margin-top:20px">いま間違えたままの問題：'+wr.length+'問</h3>';
  wr.forEach(function(q){ h+='<details><summary>'+esc(q.q)+'</summary><div class="exp c" style="margin-top:6px"><b>正解：</b>'+q.o.slice(0,q.n).map(esc).join(' ／ ')+'<br><b>ポイント：</b>'+esc(q.pt)+'</div></details>'; });
  h+='<div class="row"><button class="btn" id="reset">記録を消して最初からやり直す</button></div></div>';
  box.innerHTML=h;
  twoTap(document.getElementById("reset"),"もう一度押すと全記録を消します",function(){ S.rec={}; S.best={}; save(); renderStats(); home(); });
}

<pre><code>"messages": [
  {"role": "user",      "content": "返品の手順を教えてください"},
  {"role": "assistant", "content": "返品は次の手順で行います。まず…"},
  {"role": "user",      "content": "期限はいつまでですか？"}
]</code></pre>
</div>

<div class="card">
<h3>④ ツールを使うやり取り（<code>tool_use</code> の往復）</h3>
<p><b>手順1</b>　<span class="dir">アプリ → API</span>質問と一緒に、ツール定義（name / description / input_schema）を送る。</p>
<pre><code>"tools": [{
  "name": "get_weather",
  "description": "指定した都市の現在の天気を返す。天気を聞かれたときに使う。",
  "input_schema": {
    "type": "object",
    "properties": {"city": {"type": "string"}},
    "required": ["city"]
  }
}],
"messages": [{"role": "user", "content": "東京の天気は？"}]</code></pre>
<p><b>手順2</b>　<span class="dir back">API → アプリ</span>Claude は答えず、ツールの実行を<b>要求</b>する。<code>stop_reason</code> が <code>tool_use</code>。</p>
<pre><code>"content": [
  {"type": "text", "text": "天気を調べます。"},
  {"type": "tool_use", "id": "toolu_01", "name": "get_weather", "input": {"city": "東京"}}
],
"stop_reason": "tool_use"</code></pre>
<p><b>手順3</b>　<span class="dir self">アプリの中</span>アプリが自分のコードで <code>get_weather("東京")</code> を実行する。Claude は実行しません。</p>
<p><b>手順4</b>　<span class="dir">アプリ → API</span>履歴に、Claude の要求と、ツールの結果（<code>tool_result</code>）を足して送る。</p>
<pre><code>"messages": [
  {"role": "user", "content": "東京の天気は？"},
  {"role": "assistant", "content": [
    {"type": "text", "text": "天気を調べます。"},
    {"type": "tool_use", "id": "toolu_01", "name": "get_weather", "input": {"city": "東京"}}
  ]},
  {"role": "user", "content": [
    {"type": "tool_result", "tool_use_id": "toolu_01", "content": "晴れ、18℃"}
  ]}
]</code></pre>
<p><b>手順5</b>　<span class="dir back">API → アプリ</span>結果を受けた Claude が、最終の答えを返す。<code>stop_reason</code> は <code>end_turn</code>。</p>
<pre><code>"content": [{"type": "text", "text": "東京は晴れで、気温は18℃です。"}],
"stop_reason": "end_turn"</code></pre>
<div class="point"><b>覚えること：</b><code>tool_use</code> が返る間は、「実行 → <code>tool_result</code> を返す → 再度呼ぶ」を繰り返す。<code>tool_result</code> の <code>tool_use_id</code> は、要求の <code>id</code> と同じにする。</div>
</div>

<div class="card">
<h3>stop_reason の一覧</h3>
<table>
<tr><th>値</th><th>意味</th><th>アプリの対応</th></tr>
<tr><td><code>end_turn</code></td><td>Claude が答え終えた</td><td>結果を使う</td></tr>
<tr><td><code>max_tokens</code></td><td>出力が上限で途中で切れた</td><td>上限を増やす／短くさせる</td></tr>
<tr><td><code>tool_use</code></td><td>ツールの実行を求めている</td><td>実行して <code>tool_result</code> を返す</td></tr>
<tr><td><code>stop_sequence</code></td><td>指定した停止文字列が出た</td><td>どれが出たかを読み、そこまでを結果として使う</td></tr>
<tr><td><code>pause_turn</code></td><td>サーバー側ツールのループが回数の上限に達した</td><td>Claude の内容をそのまま送り返して続ける</td></tr>
<tr><td><code>refusal</code></td><td>Claude が応答を断った</td><td><code>stop_details</code> を読み、必要なら別モデルで再試行</td></tr>
<tr><td><code>model_context_window_exceeded</code></td><td>出力がモデルのコンテキストウィンドウを埋めた</td><td>途中で切れた結果として扱う</td></tr>
</table>
</div>

<div class="card">
<h3>主なエラーと対応</h3>
<table>
<tr><th>コード</th><th>意味</th><th>再試行</th></tr>
<tr><td>400</td><td>リクエストの内容が誤り</td><td>× 直してから送る</td></tr>
<tr><td>401</td><td>API キーが無効・未指定</td><td>× キーを確認</td></tr>
<tr><td>403</td><td>権限がない</td><td>× 権限を確認</td></tr>
<tr><td>404</td><td>指定したものが見つからない（URL や ID の誤りなど）</td><td>× 指定を直す</td></tr>
<tr><td>413</td><td>リクエストが大きすぎる</td><td>× 小さくする</td></tr>
<tr><td>429</td><td>レート制限</td><td>○ 待って再試行（指数バックオフ）</td></tr>
<tr><td>500</td><td>API 側の内部エラー</td><td>○ 待って再試行</td></tr>
<tr><td>504</td><td>処理がタイムアウトした（長い要求はストリーミングを使う）</td><td>△ ストリーミングに切り替える</td></tr>
<tr><td>529</td><td>API が混雑している</td><td>○ 待って再試行</td></tr>
</table>
</div>

<div class="card">
<h3>ストリーミングでは</h3>
<p>リクエストに <code>"stream": true</code> を足すと、レスポンスが文字の断片として順に届きます。完成を待たずに画面へ出せるので、体感の待ち時間が短くなります。品質や料金は変わりません。</p>
</div>
